<!doctype html>
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Iniciar sesión')}"></head>
<body>
    <header th:replace="~{fragmentos :: cabecera}"></header>
    <main id="contenido" class="acceso">
        <section class="panel">
            <h1>Iniciar sesión</h1>
            <p class="texto-secundario">Entrá para pronosticar partidos y consultar la clasificación de tus torneos.</p>
            <p th:replace="~{fragmentos :: avisos}"></p>
            <p class="error" role="alert" th:if="${param.error}">El correo o la contraseña son incorrectos.</p>
            <p class="aviso" role="status" th:if="${param.salida}">Cerraste sesión.</p>
            <form method="post" th:action="@{/login}" class="campos">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" name="email" required maxlength="254" autocomplete="username">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" required autocomplete="current-password">
                <button type="submit" class="boton primario">Entrar</button>
            </form>
            <p class="acceso-enlace"><a th:href="@{/registro}">Crear una cuenta</a></p>
        </section>
    </main>
</body>
</html>
